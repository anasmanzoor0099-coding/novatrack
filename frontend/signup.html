<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — NovaTrack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="auth-body">

    <div class="auth-wrapper">

        <!-- LEFT: Visual Panel -->
        <aside class="auth-visual">
            <a href="index.html" class="logo auth-visual__logo">
                NOVA<span>.</span>
            </a>

            <div class="auth-visual__content">
                <h2 class="auth-visual__title">
                    Join the
                    <span class="text-gradient">tracking revolution</span>
                </h2>
                <p class="auth-visual__text">
                    Create your free account and start tracking packages in immersive 3D.
                </p>

                <div class="auth-visual__stats">
                    <div class="stat">
                        <div class="stat__number">Free</div>
                        <div class="stat__label">Forever</div>
                    </div>
                    <div class="stat">
                        <div class="stat__number">No</div>
                        <div class="stat__label">Card Required</div>
                    </div>
                </div>
            </div>

            <div class="auth-visual__glow"></div>
        </aside>

        <!-- RIGHT: Form Panel -->
        <main class="auth-form">
            <div class="auth-form__inner">

                <div class="auth-form__header">
                    <h1 class="auth-form__title">Create Account</h1>
                    <p class="auth-form__subtitle">
                        Already have one? <a href="login.html">Sign in</a>
                    </p>
                </div>

                <form id="signupForm" class="form" novalidate>

                    <div class="form__group">
                        <label for="name" class="form__label">Full Name</label>
                        <input
                            type="text"
                            id="name"
                            class="form__input"
                            placeholder="Your name"
                            autocomplete="name"
                            required
                        />
                    </div>

                    <div class="form__group">
                        <label for="email" class="form__label">Email</label>
                        <input
                            type="email"
                            id="email"
                            class="form__input"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <div class="form__group">
                        <label for="password" class="form__label">Password</label>
                        <div class="form__input-wrapper">
                            <input
                                type="password"
                                id="password"
                                class="form__input"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            />
                            <button type="button" class="form__toggle-pw" id="togglePw" aria-label="Show password">
                                👁
                            </button>
                        </div>
                        <div class="pw-strength" id="pwStrength">
                            <div class="pw-strength__bar" id="pwBar"></div>
                        </div>
                        <div class="form__hint" id="pwHint">Minimum 6 characters</div>
                    </div>

                    <div class="form__group">
                        <label for="confirm" class="form__label">Confirm Password</label>
                        <div class="form__input-wrapper">
                            <input
                                type="password"
                                id="confirm"
                                class="form__input"
                                placeholder="Confirm password"
                                autocomplete="new-password"
                                required
                            />
                            <button type="button" class="form__toggle-pw" id="toggleConfirm" aria-label="Show password">
                                👁
                            </button>
                        </div>
                    </div>

                    <label class="form__checkbox">
                        <input type="checkbox" id="terms" />
                        <span>I agree to the <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a></span>
                    </label>

                    <div class="form__message" id="formMessage"></div>

                    <button type="submit" class="btn btn--primary btn--lg form__submit" id="submitBtn">
                        Create Account
                    </button>

                </form>

            </div>
        </main>

    </div>

    <script src="js/auth.js"></script>
</body>
</html>
