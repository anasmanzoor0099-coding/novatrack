<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — NovaTrack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- ===== SEO META TAGS ===== -->
    <meta name="description" content="Sign in to your NovaTrack account and start tracking orders in stunning 3D visualization." />
    <meta name="keywords" content="login, sign in, novatrack login, account access" />
    <meta name="author" content="Anas Manzoor" />
    <meta name="robots" content="noindex, follow" />

    <!-- ===== OPEN GRAPH ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://novatrack-frontend.vercel.app/login.html" />
    <meta property="og:title" content="Sign In — NovaTrack" />
    <meta property="og:description" content="Sign in to your NovaTrack account." />
    <meta property="og:site_name" content="NovaTrack" />

    <!-- ===== TWITTER CARD ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sign In — NovaTrack" />
    <meta name="twitter:description" content="Sign in to your NovaTrack account." />

    <!-- Favicon -->
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <aside class="auth-visual">
            <a href="index.html" class="logo auth-visual__logo">NOVA<span>.</span></a>

            <div class="auth-visual__content">
                <h2 class="auth-visual__title">
                    Welcome back to the
                    <span class="text-gradient">future of tracking</span>
                </h2>
                <p class="auth-visual__text">
                    Sign in to continue following your packages in immersive 3D.
                </p>

                <div class="auth-visual__stats">
                    <div class="stat">
                        <div class="stat__number">50K+</div>
                        <div class="stat__label">Orders Tracked</div>
                    </div>
                    <div class="stat">
                        <div class="stat__number">99.9%</div>
                        <div class="stat__label">Uptime</div>
                    </div>
                </div>
            </div>

            <div class="auth-visual__glow"></div>
        </aside>

        <main class="auth-form">
            <div class="auth-form__inner">
                <div class="auth-form__header">
                    <h1 class="auth-form__title">Sign In</h1>
                    <p class="auth-form__subtitle">
                        Don't have an account? <a href="signup.html">Create one</a>
                    </p>
                </div>

                <form id="loginForm" class="form" novalidate>
                    <div class="form__group">
                        <label for="email" class="form__label">Email</label>
                        <input type="email" id="email" class="form__input" placeholder="you@example.com" autocomplete="email" required />
                    </div>

                    <div class="form__group">
                        <div class="form__label-row">
                            <label for="password" class="form__label">Password</label>
                            <a href="#" class="form__link">Forgot?</a>
                        </div>
                        <div class="form__input-wrapper">
                            <input type="password" id="password" class="form__input" placeholder="••••••••" autocomplete="current-password" required />
                            <button type="button" class="form__toggle-pw" id="togglePw" aria-label="Show password">👁</button>
                        </div>
                    </div>

                    <div class="form__message" id="formMessage"></div>

                    <button type="submit" class="btn btn--primary btn--lg form__submit" id="submitBtn">
                        Sign In
                    </button>
                </form>

                <div class="auth-form__footer">
                    <p class="auth-form__footer-text">
                        By signing in you agree to our
                        <a href="terms.html">Terms</a> &amp; <a href="privacy.html">Privacy Policy</a>
                    </p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
